:root{--bg:#eceeed;--card:#ffffff;--fg:#141414;--muted:#5b6164;--roble:#d9bf96;--sans:Manrope,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1f2022;--fg:#f1f1ef;--muted:#9a9ea1;--roble:#a8875d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--card:#1f2022;--fg:#f1f1ef;--muted:#9a9ea1;--roble:#a8875d;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:880px;margin:0 auto;display:grid;gap:24px}
.sobre{font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

h1::after{content:"";display:block;width:64px;height:6px;background:var(--roble);margin-top:14px}
.intro{color:var(--muted);line-height:1.5;margin:0;max-width:60ch}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:16px}
figure{margin:0;background:var(--card);padding:10px;display:grid;gap:10px;align-content:start}
img{width:100%;display:block}
figcaption{display:grid;gap:4px;font-size:13px;line-height:1.4}
figcaption b{font-weight:800}
figcaption span{color:var(--muted)}

<div><div class="sobre">Anaquel · mueble alternativo</div><h1>Nórdico</h1>
<p class="intro">Estantería abierta de roble claro con montantes negros, pared lisa y etiquetas en tinta. Capturas de la app real con una biblioteca de prueba. La propuesta: baldas más altas para que no se corten los títulos.</p></div>
