<title>Anaquel en carrusel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Manrope:wght@400;500;600;800&display=swap">
<style>
/* Una pantalla de móvil: cabecera, buscador, géneros, carrusel 3D de libros y ficha del libro centrado */
:root{--bg:#dde2de;--card:#f7f8f6;--fg:#131313;--muted:#4f5752;--line:#c5ccc7;--accent:#b08a46;--suelo:#c9cfca;
--display:"Bodoni Moda",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f;--card:#19191b;--fg:#f2f0ec;--muted:#9b978f;--line:#2a2a2e;--accent:#d4ad66;--suelo:#161617;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0f;--card:#19191b;--fg:#f2f0ec;--muted:#9b978f;--line:#2a2a2e;--accent:#d4ad66;--suelo:#161617;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:430px;margin:0 auto;display:grid;gap:14px;min-width:0}
header{display:flex;justify-content:space-between;align-items:flex-end}
.sobre{font:700 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{font:500 40px/1 var(--display);margin:4px 0 0;letter-spacing:-.5px}
.cuenta{font:600 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
.cuenta b{display:block;font:500 28px/1 var(--display);color:var(--fg);letter-spacing:0}
.buscar{position:relative}
.buscar input{width:100%;box-sizing:border-box;font:500 16px var(--sans);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 13px 42px;min-height:48px}
.buscar input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.buscar svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted)}
.generos{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.generos::-webkit-scrollbar{display:none}
.generos button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px var(--sans);cursor:pointer}
.generos button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* Carrusel */
.escena{position:relative;height:330px;perspective:1100px;perspective-origin:50% 42%;overflow:hidden;touch-action:pan-y;cursor:grab;border-radius:18px;
  background:linear-gradient(180deg,transparent 0 68%,var(--suelo) 68% 100%);user-select:none;-webkit-user-select:none}
.escena:active{cursor:grabbing}
.escena:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.libro{position:absolute;left:50%;top:26px;width:150px;height:228px;margin-left:-75px;transform-style:preserve-3d;will-change:transform}
.cara{position:absolute;top:0;height:100%;backface-visibility:hidden}
.tapa{left:0;width:100%;background:var(--c,#6e2a26) center/100% 100%;border-radius:1px 3px 3px 1px;transform:translateZ(calc(var(--t)/2));
  box-shadow:inset 5px 0 6px -3px rgba(0,0,0,.4)}
.tapa::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.2),transparent 38%,rgba(0,0,0,.14))}
.tapa.gen{display:grid;place-items:center;text-align:center;color:#f4ecdc;padding:14px;box-sizing:border-box;font:italic 500 17px/1.15 var(--display)}
.tras{left:0;width:100%;background:var(--c,#6e2a26);transform:rotateY(180deg) translateZ(calc(var(--t)/2))}
.lomo{left:calc(var(--t)/-2);width:var(--t);transform:rotateY(-90deg);transform-origin:50% 50%;margin-left:0;background:var(--l,#f7f6f2);color:var(--lt,#151515);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0;box-sizing:border-box;overflow:hidden;
  background-image:linear-gradient(90deg,rgba(0,0,0,.2),rgba(255,255,255,.14) 30%,rgba(0,0,0,.14))}
.lomo span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lomo .au{flex:none;max-height:40%;font:700 7.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--la,#c4161c)}
.lomo .ti{flex:1;font:500 12px var(--display)}
.lomo .lg{flex:none;writing-mode:horizontal-tb;transform:none;font:italic 700 8px Georgia,serif}
.hojas{left:calc(100% - var(--t)/2);width:var(--t);transform:rotateY(90deg);
  background:repeating-linear-gradient(90deg,#e9e4d6 0 1.5px,#d2ccbb 1.5px 2.5px)}
.sombra{position:absolute;left:8px;right:8px;bottom:-16px;height:14px;border-radius:50%;background:rgba(0,0,0,.34);filter:blur(7px);transform:rotateX(90deg) translateZ(-6px)}
.marco{position:relative}
.flecha{position:absolute;top:118px;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--fg);box-shadow:0 4px 12px rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer;z-index:5}
.flecha.iz{left:6px}.flecha.de{right:6px}
.flecha svg{width:18px;height:18px}
.ficha{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:4px;min-height:92px}
.eti{font:700 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.ficha h2{font:500 26px/1.1 var(--display);margin:2px 0;text-wrap:balance}
.ficha p{margin:0;color:var(--muted);font-size:14px}
.pos{text-align:center;font:600 11px var(--sans);letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.vacio{text-align:center;color:var(--muted);font:italic 400 18px var(--display);padding-top:120px}
.nota{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.libro{transition:none!important}}
</style>
<main>
<header><div><div class="sobre">Mi biblioteca</div><h1>Anaquel</h1></div><div class="cuenta"><b id="n">11</b>libros</div></header>
<label class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input id="q" type="search" placeholder="Buscar título o autor" autocomplete="off" aria-label="Buscar título o autor"></label>
<div class="generos" id="generos" role="group" aria-label="Género"></div>
<div class="marco"><div class="escena" id="escena" tabindex="0" role="listbox" aria-label="Libros">
</div>
<button class="flecha iz" id="ant" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<button class="flecha de" id="sig" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<div class="pos" id="pos"></div>
<div class="ficha" id="ficha" aria-live="polite"></div>
<p class="nota">Mock interactivo: arrastra o usa las flechas para pasar los libros, toca uno para traerlo al centro, y prueba el buscador y los géneros. Portadas reales; los lomos son una recreación.</p>
</main>

const COL={folio:{l:'#f7f6f2',lt:'#151515',la:'#c4161c',lg:'folio'},blanche:{l:'#efe6cf',lt:'#b3262a',la:'#1d1a14',lg:'nrf'},albin:{l:'#ebe7de',lt:'#222',la:'#222',lg:''},color:{l:'#7d7a52',lt:'#fff',la:'#fff',lg:''}};
const escena=document.getElementById('escena'),ficha=document.getElementById('ficha'),posEl=document.getElementById('pos');
let lista=LIBROS,nodos=[],pos=0,genero='Todos',vel=0,raf=0;
const sinT=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function monta(){
  nodos.forEach(n=>n.remove());nodos=[];
  escena.querySelector('.vacio')?.remove();
  if(!lista.length){const v=document.createElement('p');v.className='vacio';v.textContent='Ningún libro con esa búsqueda.';escena.append(v);ficha.innerHTML='';posEl.textContent='';return}
  lista.forEach((b,i)=>{const c=COL[b.c],el=document.createElement('div');el.className='libro';el.setAttribute('role','option');
    el.style.cssText=`--t:${b.w}px;--l:${c.l};--lt:${c.lt};--la:${c.la}`;
    el.innerHTML=`<div class="cara tras"></div><div class="cara hojas"></div><div class="cara lomo"><span class="au">${b.a.split(' ').pop()}</span><span class="ti">${b.t}</span><span class="lg">${c.lg}</span></div>`+
      (b.img?`<div class="cara tapa" style="background-image:url(${b.img})"></div>`:`<div class="cara tapa gen">${b.t}</div>`)+'<div class="sombra"></div>';
    el.addEventListener('click',()=>{if(!movido)ve(i)});escena.append(el);nodos.push(el)});
  pos=Math.min(pos,lista.length-1);pinta();
}
function pinta(){
  nodos.forEach((el,i)=>{const d=i-pos,a=Math.abs(d),s=Math.sign(d),k=Math.min(a,1);
    const x=s*(k*96+Math.max(0,a-1)*46), z=-k*150-Math.max(0,a-1)*26, r=-s*k*64;
    el.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${r}deg)`;
    el.style.zIndex=String(100-Math.round(a*10));el.style.opacity=a>5.5?0:1;
    el.setAttribute('aria-selected',String(Math.round(pos)===i))});
  const b=lista[Math.round(pos)];if(!b)return;
  ficha.innerHTML=`<div class="eti">${b.g}</div><h2>${b.t}</h2><p>${b.a} · ${b.y}</p>`;
  posEl.textContent=`${Math.round(pos)+1} / ${lista.length}`;
}
function anima(dest){cancelAnimationFrame(raf);const paso=()=>{const dif=dest-pos;if(Math.abs(dif)<.004){pos=dest;pinta();return}pos+=dif*.18;pinta();raf=requestAnimationFrame(paso)};
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){pos=dest;pinta()}else paso()}
function ve(i){anima(Math.max(0,Math.min(lista.length-1,i)))}
let x0=0,p0=0,abajo=false,movido=false,xu=0,tu=0;
escena.addEventListener('pointerdown',e=>{if(e.target.closest('.flecha'))return;abajo=true;movido=false;x0=xu=e.clientX;p0=pos;tu=performance.now();vel=0;cancelAnimationFrame(raf);escena.setPointerCapture(e.pointerId)});
escena.addEventListener('pointermove',e=>{if(!abajo)return;const dx=e.clientX-x0;if(Math.abs(dx)>6)movido=true;const t=performance.now();vel=(e.clientX-xu)/Math.max(1,t-tu);xu=e.clientX;tu=t;
  pos=Math.max(-.4,Math.min(lista.length-.6,p0-dx/88));pinta()});
const suelta=()=>{if(!abajo)return;abajo=false;ve(Math.round(pos-vel*3.2));setTimeout(()=>movido=false,0)};
escena.addEventListener('pointerup',suelta);escena.addEventListener('pointercancel',suelta);
escena.addEventListener('keydown',e=>{if(e.key==='ArrowRight')ve(Math.round(pos)+1);if(e.key==='ArrowLeft')ve(Math.round(pos)-1)});
escena.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault();ve(Math.round(pos)+Math.sign(e.deltaX))}},{passive:false});
document.getElementById('ant').onclick=()=>ve(Math.round(pos)-1);document.getElementById('sig').onclick=()=>ve(Math.round(pos)+1);
function filtra(){const q=sinT(document.getElementById('q').value.trim());
  lista=LIBROS.filter(b=>(genero==='Todos'||b.g===genero)&&(!q||sinT(b.t+' '+b.a).includes(q)));
  document.getElementById('n').textContent=lista.length;pos=0;monta()}
document.getElementById('q').addEventListener('input',filtra);
const gs=['Todos',...new Set(LIBROS.map(b=>b.g))],cont=document.getElementById('generos');
gs.forEach(g=>{const b=document.createElement('button');b.type='button';b.textContent=g;b.setAttribute('aria-pressed',String(g===genero));
  b.onclick=()=>{genero=g;[...cont.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));filtra()};cont.append(b)});
pos=2;monta();
</script>
